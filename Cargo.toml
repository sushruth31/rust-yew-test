[package]
name = "yew-app"
version = "0.1.0"
edition = "2021"
publish = false

# Host-buildable half: the domain logic and its dependencies. Keeping these out of
# the wasm-only section is what lets `cargo test` run natively in seconds.
[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Browser half. Gated on the target so a host `cargo test` never builds yew, web-sys
# or an HTTP client it cannot use anyway.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
gloo-net = "0.5"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement"] }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
